<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="What I bring"><title>What I bring</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="accv" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="680"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0E1529"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1A2440"/></pattern>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C3AED" stop-opacity=".22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
</defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.up{opacity:1;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(1.9)}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.type{opacity:1;animation:type .01s forwards} @keyframes type{to{opacity:1}}
</style><clipPath id="r"><rect width="1000" height="470" rx="20"/></clipPath><g clip-path="url(#r)"><rect width="1000" height="470" fill="url(#bg)"/><rect width="1000" height="470" fill="url(#grid)"/><circle cx="500" cy="235" r="380" fill="url(#glow)"/><g class="up" style="animation-delay:0.10s"><rect x="24" y="22" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="24" y="22" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="44" y="44" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="63" y="70" font-size="19" text-anchor="middle">🤖</text><text x="96" y="69" font-size="17" font-weight="700" fill="#F1F5F9">Agentic &amp; Generative AI</text><text x="44" y="114" font-size="13" fill="#A3AEC2">Multi-agent workflows with LangGraph,</text><text x="44" y="133" font-size="13" fill="#A3AEC2">tool-using agents with LangChain, RAG</text><text x="44" y="152" font-size="13" fill="#A3AEC2">over private data and fully offline</text><text x="44" y="171" font-size="13" fill="#A3AEC2">LLMs with Ollama.</text><rect x="44" y="187" width="76" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="82" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">LangGraph</text><rect x="126" y="187" width="76" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="164" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">LangChain</text><rect x="208" y="187" width="36" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="226" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">RAG</text><rect x="250" y="187" width="56" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="278" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Ollama</text></g><g class="up" style="animation-delay:0.22s"><rect x="354" y="22" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="354" y="22" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="374" y="44" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="393" y="70" font-size="19" text-anchor="middle">🌐</text><text x="426" y="69" font-size="17" font-weight="700" fill="#F1F5F9">Full Stack Engineering</text><text x="374" y="114" font-size="13" fill="#A3AEC2">Production web platforms end to end:</text><text x="374" y="133" font-size="13" fill="#A3AEC2">REST APIs, auth, data modelling and</text><text x="374" y="152" font-size="13" fill="#A3AEC2">fast, responsive, animated interfaces.</text><rect x="374" y="187" width="43" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="395" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">MERN</text><rect x="423" y="187" width="89" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="467" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Spring Boot</text><rect x="518" y="187" width="63" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="549" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Laravel</text><rect x="587" y="187" width="63" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="618" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">FastAPI</text></g><g class="up" style="animation-delay:0.34s"><rect x="684" y="22" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="684" y="22" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="704" y="44" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="723" y="70" font-size="19" text-anchor="middle">📱</text><text x="756" y="69" font-size="17" font-weight="700" fill="#F1F5F9">Cross-Platform Mobile</text><text x="704" y="114" font-size="13" fill="#A3AEC2">One codebase for Android &amp; iOS with</text><text x="704" y="133" font-size="13" fill="#A3AEC2">clean state management, smooth UI and</text><text x="704" y="152" font-size="13" fill="#A3AEC2">solid API integration.</text><rect x="704" y="187" width="96" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="752" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">React Native</text><rect x="806" y="187" width="63" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="837" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Flutter</text><rect x="875" y="187" width="43" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="896" y="202" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Dart</text></g><g class="up" style="animation-delay:0.46s"><rect x="24" y="247" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="24" y="247" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="44" y="269" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="63" y="295" font-size="19" text-anchor="middle">📊</text><text x="96" y="294" font-size="17" font-weight="700" fill="#F1F5F9">ML · DL · Data Science</text><text x="44" y="339" font-size="13" fill="#A3AEC2">From data wrangling and visualisation</text><text x="44" y="358" font-size="13" fill="#A3AEC2">to training and evaluating classical ML</text><text x="44" y="377" font-size="13" fill="#A3AEC2">and deep-learning models.</text><rect x="44" y="412" width="63" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="75" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">PyTorch</text><rect x="113" y="412" width="96" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="161" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">scikit-learn</text><rect x="215" y="412" width="56" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="243" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Pandas</text></g><g class="up" style="animation-delay:0.58s"><rect x="354" y="247" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="354" y="247" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="374" y="269" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="393" y="295" font-size="19" text-anchor="middle">👥</text><text x="426" y="294" font-size="17" font-weight="700" fill="#F1F5F9">Leadership &amp; Delivery</text><text x="374" y="339" font-size="13" fill="#A3AEC2">Leading a remote team: sprint planning,</text><text x="374" y="358" font-size="13" fill="#A3AEC2">code reviews, mentoring and owning</text><text x="374" y="377" font-size="13" fill="#A3AEC2">client delivery start to finish.</text><rect x="374" y="412" width="76" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="412" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Team Lead</text><rect x="456" y="412" width="49" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="481" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Agile</text><rect x="511" y="412" width="89" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="556" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Code Review</text></g><g class="up" style="animation-delay:0.70s"><rect x="684" y="247" width="312" height="205" rx="16" fill="url(#card)" stroke="#24304F"/><rect x="684" y="247" width="312" height="3" rx="1.5" fill="url(#acc)"/><rect x="704" y="269" width="38" height="38" rx="10" fill="#1A2342" stroke="#2D3B63"/><text x="723" y="295" font-size="19" text-anchor="middle">🔐</text><text x="756" y="294" font-size="17" font-weight="700" fill="#F1F5F9">Networking &amp; Security</text><text x="704" y="339" font-size="13" fill="#A3AEC2">Secure-by-default backends with</text><text x="704" y="358" font-size="13" fill="#A3AEC2">role-based access, validation and</text><text x="704" y="377" font-size="13" fill="#A3AEC2">strong networking fundamentals.</text><rect x="704" y="412" width="43" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="725" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">RBAC</text><rect x="753" y="412" width="43" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="774" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Auth</text><rect x="801" y="412" width="83" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="843" y="427" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Networking</text></g></g><rect x=".5" y=".5" width="999" height="469" rx="20" fill="none" stroke="#1E293B"/></svg>