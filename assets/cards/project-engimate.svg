<svg xmlns="http://www.w3.org/2000/svg" width="490" height="310" viewBox="0 0 490 310" role="img" aria-label="EngiMate — Offline AI Agent for Engineers"><title>EngiMate — Offline AI Agent for Engineers</title><defs>
