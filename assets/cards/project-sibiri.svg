<svg xmlns="http://www.w3.org/2000/svg" width="490" height="310" viewBox="0 0 490 310" role="img" aria-label="SIBIRI — Educational Content OS"><title>SIBIRI — Educational Content OS</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="accv" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="680"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0E1529"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1A2440"/></pattern>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C3AED" stop-opacity=".22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
</defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.up{opacity:1;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(1.9)}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.type{opacity:1;animation:type .01s forwards} @keyframes type{to{opacity:1}}
</style><clipPath id="r"><rect width="490" height="310" rx="20"/></clipPath><g clip-path="url(#r)"><rect width="490" height="310" fill="url(#bg)"/><rect width="490" height="310" fill="url(#grid)"/><circle cx="450" cy="30" r="150" fill="#A78BFA" opacity=".07"/><rect width="490" height="4" fill="#A78BFA"/><g class="up" style="animation-delay:.1s"><rect x="28" y="28" width="52" height="52" rx="14" fill="#1A2342" stroke="#2D3B63"/><text x="54" y="63" font-size="26" text-anchor="middle">🎓</text><text x="96" y="52" font-size="23" font-weight="800" fill="#F8FAFC">SIBIRI</text><text x="96" y="74" font-size="14" fill="#A78BFA" font-weight="600">Educational Content OS</text><text x="462" y="44" class="m" font-size="10.5" text-anchor="end" fill="#64748B" letter-spacing="1">AGENTIC AI · EDTECH</text></g><g class="up" style="animation-delay:.3s"><text x="28" y="124" font-size="13.5" fill="#A3AEC2">An agentic AI operating system for teachers. Upload notes;</text><text x="28" y="144" font-size="13.5" fill="#A3AEC2">agents analyse the lesson, plan content and generate</text><text x="28" y="164" font-size="13.5" fill="#A3AEC2">quizzes, videos, labs and mind maps, then publish to Moodle.</text></g><g class="up" style="animation-delay:.5s"><rect x="28" y="210" width="76" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="66" y="225" font-size="11.5" text-anchor="middle" fill="#C7D2FE">LangGraph</text><rect x="110" y="210" width="76" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="148" y="225" font-size="11.5" text-anchor="middle" fill="#C7D2FE">LangChain</text><rect x="192" y="210" width="63" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="223" y="225" font-size="11.5" text-anchor="middle" fill="#C7D2FE">FastAPI</text><rect x="261" y="210" width="69" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="295" y="225" font-size="11.5" text-anchor="middle" fill="#C7D2FE">ChromaDB</text><rect x="336" y="210" width="56" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="364" y="225" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Celery</text><rect x="28" y="238" width="83" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="69" y="253" font-size="11.5" text-anchor="middle" fill="#C7D2FE">PostgreSQL</text><rect x="117" y="238" width="83" height="22" rx="11.0" fill="#18213D" stroke="#2D3B63"/><text x="158" y="253" font-size="11.5" text-anchor="middle" fill="#C7D2FE">Moodle API</text></g><g class="up" style="animation-delay:.7s"><line x1="28" y1="264" x2="462" y2="264" stroke="#1E293B"/><circle cx="34" cy="286" r="4" fill="#A78BFA"/><text x="46" y="291" class="m" font-size="12.5" fill="#CBD5E1">In development</text><text x="462" y="291" font-size="12.5" text-anchor="end" fill="#94A3B8">View →</text></g></g><rect x=".5" y=".5" width="489" height="309" rx="20" fill="none" stroke="#1E293B"/></svg>